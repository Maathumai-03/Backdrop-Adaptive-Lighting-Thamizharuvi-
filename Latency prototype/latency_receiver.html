<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latency Receiver</title>
<style>
  html, body { margin:0; height:100%; background:#111; color:#eee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #status { position:fixed; top:12px; left:12px; font-size:13px; opacity:0.6; }
  #count { position:fixed; top:12px; right:12px; font-size:13px; opacity:0.6; }
  #flash { position:fixed; inset:0; background:#111; transition: background 0.04s linear;
    display:flex; align-items:center; justify-content:center; font-size:20px; text-align:center; padding:20px; box-sizing:border-box; }
  .lit { background:#fff !important; }
</style>
</head>
<body>
<div id="status">connecting…</div>
<div id="count">0</div>
<div id="flash">waiting for signal</div>

<script>
  const statusEl = document.getElementById('status');
  const countEl = document.getElementById('count');
  const flashEl = document.getElementById('flash');
  let count = 0;

  const ws = new WebSocket(`ws://${location.hostname}:8765`);

  ws.onopen = () => { statusEl.textContent = 'connected'; };
  ws.onclose = () => { statusEl.textContent = 'disconnected'; };
  ws.onerror = () => { statusEl.textContent = 'error — check console'; };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type !== 'flash') return;

    const receivedAt = performance.now();

    requestAnimationFrame(() => {
      const paintedAt = performance.now();
      const renderDelayMs = paintedAt - receivedAt;

      flashEl.classList.add('lit');
      flashEl.textContent = '';
      setTimeout(() => {
        flashEl.classList.remove('lit');
        flashEl.textContent = 'waiting for signal';
      }, 120);

      count += 1;
      countEl.textContent = count;

      ws.send(JSON.stringify({
        type: 'ack',
        id: data.id,
        render_delay_ms: renderDelayMs,
      }));
    });
  };
</script>
</body>
</html>
