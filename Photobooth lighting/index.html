<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth LED Controller</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide React Icons as SVG components
        const Power = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.77.04" />
            </svg>
        );

        const Lightbulb = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" />
                <path d="M9 18h6" />
                <path d="M10 22h4" />
            </svg>
        );

        const Sparkles = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
                <path d="M5 3v4M3 5h4M19 17v4M17 19h4" />
            </svg>
        );

        const Zap = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
        );

        const Settings = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                <circle cx="12" cy="12" r="3" />
            </svg>
        );

        const PhotoboothController = () => {
            const [mqttStatus, setMqttStatus] = useState('disconnected');
            const [client, setClient] = useState(null);
            const [brokerUrl, setBrokerUrl] = useState('broker.hivemq.com');
            const [brokerPort, setBrokerPort] = useState(8000);
            const [customBroker, setCustomBroker] = useState('');
            const [customPort, setCustomPort] = useState('8000');
            const [showSettings, setShowSettings] = useState(false);

            const [leds, setLeds] = useState({
                T: { state: true, brightness: 50, pattern: 'SOLID' },
                M: { state: true, brightness: 50, pattern: 'SOLID' },
                L: { state: true, brightness: 50, pattern: 'SOLID' },
                R: { state: true, brightness: 50, pattern: 'SOLID' },
                V: { state: true, brightness: 50, pattern: 'SOLID' },
                OUTER: { state: true, brightness: 50, pattern: 'SOLID' }
            });

            const [sequencePattern, setSequencePattern] = useState('NONE');
            const [combinedPattern, setCombinedPattern] = useState('NONE');
            const [activeTab, setActiveTab] = useState('individual');

            const patterns = ['SOLID', 'BREATHING', 'PULSE', 'FADE', 'STROBE', 'HEARTBEAT', 'CANDLE', 'FIRE'];
            const sequencePatterns = ['NONE', 'WAVE_LEFT', 'WAVE_RIGHT', 'CENTER_OUT', 'ALTERNATE', 'CHASE', 'SPARKLE', 'THEATER', 'BOUNCE'];
            const combinedPatterns = ['NONE', 'SYNC', 'ALTERNATE', 'CHASE_FRAME', 'BREATHE_PULSE', 'FRAME', 'WAVE_ALL', 'RIPPLE', 'TWINKLE', 'WATERFALL', 'HEARTBEAT_ALL'];

            const connectMQTT = () => {
                try {
                    setMqttStatus('connecting');

                    const newClient = new Paho.MQTT.Client(
                        brokerUrl,
                        brokerPort,
                        '/mqtt',
                        'photobooth-web-' + Math.random().toString(16).substr(2, 8)
                    );

                    newClient.onConnectionLost = (responseObject) => {
                        if (responseObject.errorCode !== 0) {
                            setMqttStatus('disconnected');
                            console.log('Connection lost:', responseObject.errorMessage);
                        }
                    };

                    newClient.onMessageArrived = (message) => {
                        console.log('Message received:', message.destinationName, message.payloadString);
                    };

                    const connectOptions = {
                        timeout: 10,
                        useSSL: false,
                        keepAliveInterval: 30,
                        cleanSession: true,
                        onSuccess: () => {
                            setMqttStatus('connected');
                            setClient(newClient);
                            console.log('Connected to MQTT broker:', brokerUrl + ':' + brokerPort);
                        },
                        onFailure: (error) => {
                            setMqttStatus('error');
                            console.error('Connection failed:', error);
                            alert(`Failed to connect to ${brokerUrl}:${brokerPort}\n\nTroubleshooting:\n1. Check your internet connection\n2. Try a different broker in Settings\n3. Ensure your network allows WebSocket connections\n\nError: ${error.errorMessage}`);
                        }
                    };

                    newClient.connect(connectOptions);
                } catch (error) {
                    setMqttStatus('error');
                    console.error('MQTT connection error:', error);
                    alert('Connection error. Please check the broker settings.');
                }
            };

            useEffect(() => {
                connectMQTT();
            }, []);

            const publish = (topic, message) => {
                if (client && client.isConnected()) {
                    const mqttMessage = new Paho.MQTT.Message(message);
                    mqttMessage.destinationName = topic;
                    client.send(mqttMessage);
                    console.log(`Published: ${topic} -> ${message}`);
                } else {
                    alert('Not connected to MQTT broker. Click "Connect" to connect.');
                }
            };

            const updateLED = (letter, field, value) => {
                setLeds(prev => ({
                    ...prev,
                    [letter]: { ...prev[letter], [field]: value }
                }));

                const topic = `photobooth/letter/${letter}/${field}`;
                publish(topic, value.toString());
            };

            const updateAllLetters = (field, value) => {
                const topic = `photobooth/all_letters/${field}`;
                publish(topic, value.toString());

                ['T', 'M', 'L', 'R', 'V'].forEach(letter => {
                    setLeds(prev => ({
                        ...prev,
                        [letter]: { ...prev[letter], [field]: value }
                    }));
                });
            };

            const updateAll = (field, value) => {
                const topic = `photobooth/all/${field}`;
                publish(topic, value.toString());

                Object.keys(leds).forEach(letter => {
                    setLeds(prev => ({
                        ...prev,
                        [letter]: { ...prev[letter], [field]: value }
                    }));
                });
            };

            const updateSequence = (pattern) => {
                setSequencePattern(pattern);
                setCombinedPattern('NONE');
                publish('photobooth/sequence', pattern);
            };

            const updateCombined = (pattern) => {
                setCombinedPattern(pattern);
                setSequencePattern('NONE');
                publish('photobooth/combined', pattern);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 text-white p-4">
                    <div className="max-w-6xl mx-auto">
                        {/* Header */}
                        <div className="bg-gray-800 rounded-lg p-6 mb-6 shadow-2xl border border-purple-500">
                            <div className="flex items-center justify-between flex-wrap gap-4">
                                <div className="flex items-center gap-3">
                                    <Lightbulb size={40} />
                                    <div>
                                        <h1 className="text-3xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
                                            Photobooth LED Controller
                                        </h1>
                                        <p className="text-gray-400 text-sm">MQTT over WebSocket Control System</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <div className="flex items-center gap-2">
                                        <div className={`w-3 h-3 rounded-full ${mqttStatus === 'connected' ? 'bg-green-500' :
                                                mqttStatus === 'connecting' ? 'bg-yellow-500' :
                                                    mqttStatus === 'error' ? 'bg-red-500' : 'bg-gray-500'
                                            } ${mqttStatus === 'connecting' ? 'animate-pulse' : ''}`}></div>
                                        <span className="text-sm text-gray-300">
                                            {mqttStatus === 'connected' ? 'Connected' :
                                                mqttStatus === 'connecting' ? 'Connecting...' :
                                                    mqttStatus === 'error' ? 'Error' : 'Disconnected'}
                                        </span>
                                    </div>
                                    <button
                                        onClick={() => setShowSettings(!showSettings)}
                                        className="p-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors"
                                        title="Settings"
                                    >
                                        <Settings />
                                    </button>
                                    {mqttStatus !== 'connected' && mqttStatus !== 'connecting' && (
                                        <button
                                            onClick={connectMQTT}
                                            className="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg transition-colors text-sm"
                                        >
                                            Connect
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Settings Panel */}
                        {showSettings && (
                            <div className="bg-gray-800 rounded-lg p-6 mb-6 shadow-xl border border-gray-600">
                                <h3 className="text-xl font-bold mb-4">MQTT Broker Settings</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-2">Select Broker</label>
                                        <select
                                            value={brokerUrl}
                                            onChange={(e) => {
                                                setBrokerUrl(e.target.value);
                                                if (e.target.value === 'test.mosquitto.org') setBrokerPort(8080);
                                                else if (e.target.value === 'broker.hivemq.com') setBrokerPort(8000);
                                                else if (e.target.value === 'broker.emqx.io') setBrokerPort(8083);
                                            }}
                                            className="w-full bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-600 focus:border-purple-500 focus:outline-none"
                                        >
                                            <option value="test.mosquitto.org">Eclipse Mosquitto (test.mosquitto.org:8080) - Recommended</option>
                                            <option value="broker.hivemq.com">HiveMQ (broker.hivemq.com:8000)</option>
                                            <option value="broker.emqx.io">EMQX (broker.emqx.io:8083)</option>
                                            <option value="custom">Custom Broker</option>
                                        </select>
                                    </div>

                                    {brokerUrl === 'custom' && (
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm text-gray-400 mb-2">Custom Broker Host</label>
                                                <input
                                                    type="text"
                                                    placeholder="your-broker.com"
                                                    value={customBroker}
                                                    onChange={(e) => setCustomBroker(e.target.value)}
                                                    className="w-full bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-600 focus:border-purple-500 focus:outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm text-gray-400 mb-2">WebSocket Port</label>
                                                <input
                                                    type="number"
                                                    placeholder="8080"
                                                    value={customPort}
                                                    onChange={(e) => setCustomPort(e.target.value)}
                                                    className="w-full bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-600 focus:border-purple-500 focus:outline-none"
                                                />
                                            </div>
                                        </div>
                                    )}

                                    <div className="bg-gray-900 p-4 rounded-lg text-sm text-gray-400">
                                        <p className="font-bold text-purple-400 mb-2">Current Connection:</p>
                                        <p>Broker: <span className="text-white">{brokerUrl}</span></p>
                                        <p>Port: <span className="text-white">{brokerPort}</span> (WebSocket)</p>
                                        <p className="mt-2 text-xs">For ESP32: Use port <span className="text-green-400">1883</span> (native MQTT)</p>
                                    </div>

                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => {
                                                if (brokerUrl === 'custom' && customBroker) {
                                                    setBrokerUrl(customBroker);
                                                    setBrokerPort(parseInt(customPort));
                                                }
                                                setShowSettings(false);
                                                if (client && client.isConnected()) {
                                                    client.disconnect();
                                                }
                                                setTimeout(connectMQTT, 500);
                                            }}
                                            className="flex-1 bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg transition-colors"
                                        >
                                            Apply & Reconnect
                                        </button>
                                        <button
                                            onClick={() => setShowSettings(false)}
                                            className="flex-1 bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg transition-colors"
                                        >
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Tabs */}
                        <div className="bg-gray-800 rounded-lg mb-6 p-2 flex gap-2 shadow-xl flex-wrap">
                            {['individual', 'group', 'sequence', 'combined'].map(tab => (
                                <button
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`flex-1 py-3 px-4 rounded-lg font-medium transition-all ${activeTab === tab
                                            ? 'bg-purple-600 text-white shadow-lg'
                                            : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                                        }`}
                                >
                                    {tab.charAt(0).toUpperCase() + tab.slice(1)}
                                </button>
                            ))}
                        </div>

                        {/* Individual Control */}
                        {activeTab === 'individual' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {Object.keys(leds).map(letter => (
                                    <div key={letter} className="bg-gray-800 rounded-lg p-6 shadow-xl border border-gray-700 hover:border-purple-500 transition-all">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="text-xl font-bold text-purple-400">Letter {letter}</h3>
                                            <button
                                                onClick={() => updateLED(letter, 'state', !leds[letter].state)}
                                                className={`p-2 rounded-full transition-all ${leds[letter].state ? 'bg-green-600 hover:bg-green-700' : 'bg-gray-600 hover:bg-gray-700'
                                                    }`}
                                            >
                                                <Power />
                                            </button>
                                        </div>

                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-sm text-gray-400 mb-2">
                                                    Brightness: {leds[letter].brightness}%
                                                </label>
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max="100"
                                                    value={leds[letter].brightness}
                                                    onChange={(e) => updateLED(letter, 'brightness', parseInt(e.target.value))}
                                                    className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-purple-600"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-sm text-gray-400 mb-2">Pattern</label>
                                                <select
                                                    value={leds[letter].pattern}
                                                    onChange={(e) => updateLED(letter, 'pattern', e.target.value)}
                                                    className="w-full bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-600 focus:border-purple-500 focus:outline-none"
                                                >
                                                    {patterns.map(p => (
                                                        <option key={p} value={p}>{p}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Group Control */}
                        {activeTab === 'group' && (
                            <div className="space-y-6">
                                <div className="bg-gray-800 rounded-lg p-6 shadow-xl border border-purple-500">
                                    <div className="flex items-center gap-3 mb-6">
                                        <Sparkles size={24} />
                                        <h2 className="text-2xl font-bold">All Letters (T, M, L, R, V)</h2>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div>
                                            <label className="block text-sm text-gray-400 mb-2">State</label>
                                            <button
                                                onClick={() => updateAllLetters('state', 'ON')}
                                                className="w-full bg-green-600 hover:bg-green-700 px-4 py-3 rounded-lg font-medium mb-2 transition-colors"
                                            >
                                                Turn ON
                                            </button>
                                            <button
                                                onClick={() => updateAllLetters('state', 'OFF')}
                                                className="w-full bg-red-600 hover:bg-red-700 px-4 py-3 rounded-lg font-medium transition-colors"
                                            >
                                                Turn OFF
                                            </button>
                                        </div>

                                        <div>
                                            <label className="block text-sm text-gray-400 mb-2">Brightness</label>
                                            <input
                                                type="range"
                                                min="0"
                                                max="100"
                                                defaultValue="50"
                                                onChange={(e) => updateAllLetters('brightness', parseInt(e.target.value))}
                                                className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-purple-600 mb-2"
                                            />
                                            <div className="flex gap-2">
                                                {[25, 50, 75, 100].map(val => (
                                                    <button
                                                        key={val}
                                                        onClick={() => updateAllLetters('brightness', val)}
                                                        className="flex-1 bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-sm transition-colors"
                                                    >
                                                        {val}%
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm text-gray-400 mb-2">Pattern</label>
                                            <select
                                                onChange={(e) => updateAllLetters('pattern', e.target.value)}
                                                className="w-full bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-600 focus:border-purple-500 focus:outline-none"
                                            >
                                                {patterns.map(p => (
                                                    <option key={p} value={p}>{p}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-gray-800 rounded-lg p-6 shadow-xl border border-pink-500">
                                    <div className="flex items-center gap-3 mb-6">
                                        <Zap size={24} />
                                        <h2 className="text-2xl font-bold">All Strips (Including OUTER)</h2>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div>
                                            <label className="block text-sm text-gray-400 mb-2">State</label>
                                            <button
                                                onClick={() => updateAll('state', 'ON')}
                                                className="w-full bg-green-600 hover:bg-green-700 px-4 py-3 rounded-lg font-medium mb-2 transition-colors"
                                            >
                                                Turn ALL ON
                                            </button>
                                            <button
                                                onClick={() => updateAll('state', 'OFF')}
                                                className="w-full bg-red-600 hover:bg-red-700 px-4 py-3 rounded-lg font-medium transition-colors"
                                            >
                                                Turn ALL OFF
                                            </button>
                                        </div>

                                        <div>
                                            <label className="block text-sm text-gray-400 mb-2">Brightness</label>
                                            <input
                                                type="range"
                                                min="0"
                                                max="100"
                                                defaultValue="50"
                                                onChange={(e) => updateAll('brightness', parseInt(e.target.value))}
                                                className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-purple-600 mb-2"
                                            />
                                            <div className="flex gap-2">
                                                {[25, 50, 75, 100].map(val => (
                                                    <button
                                                        key={val}
                                                        onClick={() => updateAll('brightness', val)}
                                                        className="flex-1 bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-sm transition-colors"
                                                    >
                                                        {val}%
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm text-gray-400 mb-2">Pattern</label>
                                            <select
                                                onChange={(e) => updateAll('pattern', e.target.value)}
                                                className="w-full bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-600 focus:border-purple-500 focus:outline-none"
                                            >
                                                {patterns.map(p => (
                                                    <option key={p} value={p}>{p}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Sequence Patterns */}
                        {activeTab === 'sequence' && (
                            <div className="bg-gray-800 rounded-lg p-6 shadow-xl border border-blue-500">
                                <div className="mb-6">
                                    <h2 className="text-2xl font-bold mb-2">Sequence Patterns (Letters Only)</h2>
                                    <p className="text-gray-400 text-sm">Animated patterns for the 5 letter strips. OUTER strip can be controlled independently.</p>
                                </div>

                                <div className="mb-4">
                                    <span className="text-sm text-gray-400">Current: </span>
                                    <span className="text-lg font-bold text-purple-400">{sequencePattern}</span>
                                </div>


                                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
                                    {sequencePatterns.map(pattern => (
                                        <button
                                            key={pattern}
                                            onClick={() => updateSequence(pattern)}
                                            className={`px-4 py-3 rounded-lg font-medium transition-all ${sequencePattern === pattern
                                                    ? 'bg-blue-600 text-white shadow-lg scale-105'
                                                    : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                                                }`}
                                        >
                                            {pattern.replace(/_/g, ' ')}
                                        </button>
                                    ))}
                                </div>

                                <div className="mt-6 p-4 bg-gray-900 rounded-lg border border-gray-700">
                                    <h3 className="font-bold mb-2 text-blue-400">Pattern Descriptions:</h3>
                                    <ul className="text-sm text-gray-400 space-y-1">
                                        <li><strong>WAVE_LEFT:</strong> T→M→L→R→V</li>
                                        <li><strong>WAVE_RIGHT:</strong> V→R→L→M→T</li>
                                        <li><strong>CENTER_OUT:</strong> Expands from center</li>
                                        <li><strong>ALTERNATE:</strong> Odd/even positions alternate</li>
                                        <li><strong>CHASE:</strong> Running chase with trail</li>
                                        <li><strong>SPARKLE:</strong> Random sparkle effect</li>
                                        <li><strong>THEATER:</strong> Theater chase pattern</li>
                                        <li><strong>BOUNCE:</strong> Bouncing light effect</li>
                                    </ul>
                                </div>
                            </div>
                        )}

                        {/* Combined Patterns */}
                        {activeTab === 'combined' && (
                            <div className="bg-gray-800 rounded-lg p-6 shadow-xl border border-pink-500">
                                <div className="mb-6">
                                    <h2 className="text-2xl font-bold mb-2">Combined Patterns (All 6 Strips)</h2>
                                    <p className="text-gray-400 text-sm">Advanced patterns that coordinate all letters + outer strip together.</p>
                                </div>

                                <div className="mb-4">
                                    <span className="text-sm text-gray-400">Current: </span>
                                    <span className="text-lg font-bold text-pink-400">{combinedPattern}</span>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                                    {combinedPatterns.map(pattern => (
                                        <button
                                            key={pattern}
                                            onClick={() => updateCombined(pattern)}
                                            className={`px-4 py-3 rounded-lg font-medium transition-all ${combinedPattern === pattern
                                                    ? 'bg-pink-600 text-white shadow-lg scale-105'
                                                    : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                                                }`}
                                        >
                                            {pattern.replace('_', ' ')}
                                        </button>
                                    ))}
                                </div>

                                <div className="mt-6 p-4 bg-gray-900 rounded-lg border border-gray-700">
                                    <h3 className="font-bold mb-2 text-pink-400">Pattern Descriptions:</h3>
                                    <ul className="text-sm text-gray-400 space-y-1">
                                        <li><strong>SYNC:</strong> All blink together</li>
                                        <li><strong>ALTERNATE:</strong> Letters vs Outer alternating</li>
                                        <li><strong>CHASE_FRAME:</strong> Letters chase, outer solid frame</li>
                                        <li><strong>BREATHE_PULSE:</strong> Letters breathe, outer pulses</li>
                                        <li><strong>FRAME:</strong> Outer frame with animated letters</li>
                                        <li><strong>WAVE_ALL:</strong> Wave through all 6 strips</li>
                                        <li><strong>RIPPLE:</strong> Ripple from center to outer</li>
                                        <li><strong>TWINKLE:</strong> Random twinkling all 6</li>
                                        <li><strong>WATERFALL:</strong> Cascade effect</li>
                                        <li><strong>HEARTBEAT_ALL:</strong> Synchronized heartbeat</li>
                                    </ul>
                                </div>
                            </div>
                        )}

                        {/* Footer */}
                        <div className="mt-8 text-center text-gray-500 text-sm space-y-2">
                            <p>WebSocket Connection: ws://{brokerUrl}:{brokerPort}/mqtt</p>
                            <p>For ESP32: mqtt://{brokerUrl}:1883 (native MQTT)</p>
                            <p className="mt-2">Topics: <code className="text-purple-400">photobooth/*</code></p>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(
            <PhotoboothController />
        );
    </script>
</body>

</html>
